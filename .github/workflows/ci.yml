name: test
on: [push, pull_request]
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: guillaumemeyer/watermarks-remover
          path: upstream
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements-dev.txt
      - run: for f in js/*.js; do node --check "$f"; done
      - run: python3 -m py_compile serve_local.py sidecar/unmark_stat.py
      # Scoped to tests/: run from the repo root, pytest also collects the
      # upstream checkout's own suite, so this job's verdict depended on a
      # suite this repo does not own. -rs because a parity file that skips
      # itself (no upstream module found) is a silent pass otherwise.
      - run: WATERMARKS_UPSTREAM_DIR="$PWD/upstream" pytest tests/ -q -rs
